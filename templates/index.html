<!DOCTYPE html>
<html>
<head>
    <title>Simplify It</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input[type="file"] {
            margin: 15px 0;
        }
        button {
            background-color: #4a90d9;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #357abd;
        }
        .result {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
            white-space: pre-wrap;
        }
        .error {
            color: red;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>Simplify It</h1>
    <p>Paste text OR upload a file (.txt, .pdf, .docx), then click Simplify.</p>

    <form method="POST" enctype="multipart/form-data">
        <textarea name="text_input" placeholder="Paste your text here..."></textarea>
        <br>
        <input type="file" name="file_input" accept=".txt,.pdf,.docx">
        <br>
        <button type="submit">Simplify</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if result %}
        <div class="result">{{ result }}</div>
    {% endif %}
</body>
</html>
